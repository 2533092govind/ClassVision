<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassVision - Live CCTV HUD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0b0f19; color: #f3f4f6; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #111827; border-bottom: 1px solid #1f2937; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 1.15rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .status-badge { background: #064e3b; color: #34d399; border: 1px solid #059669; padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; background: #34d399; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    main { flex: 1; display: flex; padding: 16px; gap: 16px; overflow: hidden; }
    .video-panel { flex: 3; background: #000; border-radius: 12px; border: 1px solid #1f2937; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
    .video-panel img { width: 100%; height: 100%; object-fit: contain; }
    .sidebar { flex: 1; background: #111827; border-radius: 12px; border: 1px solid #1f2937; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: #1f2937; border-radius: 8px; padding: 16px; border-left: 4px solid #38bdf8; }
    .card h3 { font-size: 0.75rem; text-transform: uppercase; color: #9ca3af; letter-spacing: 0.05em; margin-bottom: 6px; }
    .card .val { font-size: 1.7rem; font-weight: 700; color: #fff; }
    .rules-list { font-size: 0.85rem; color: #d1d5db; line-height: 1.6; margin-top: 6px; }
    .btn { background: #2563eb; color: #fff; text-decoration: none; text-align: center; padding: 12px; border-radius: 8px; font-weight: 600; transition: background 0.2s; margin-top: auto; }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <span>??</span> ClassVision // Smart Classroom AI Scanner
    </div>
    <div class="status-badge">
      <div class="status-dot"></div> UNIFIED SYSTEM ONLINE
    </div>
  </header>
  <main>
    <div class="video-panel">
      <!-- Direct Same-Origin Stream -->
      <img src="/video_feed" alt="ClassVision CCTV Feed" />
    </div>
    <div class="sidebar">
      <div class="card" style="border-left-color: #10b981;">
        <h3>Attention Index</h3>
        <div class="val" id="attn-val" style="color: #34d399;">--%</div>
      </div>
      <div class="card" style="border-left-color: #f59e0b;">
        <h3>Mobiles Detected</h3>
        <div class="val" id="phones-val" style="color: #fbbf24;">0</div>
      </div>
      <div class="card" style="border-left-color: #6366f1;">
        <h3>Active Policies</h3>
        <div class="rules-list">
          <div>? 60 FPS Head Pose Tracking</div>
          <div>? Micro-movement Liveness Check</div>
          <div>? <b>Auto-Revoke to ABSENT:</b> Phone > 15s</div>
        </div>
      </div>
      <a href="/faculty.html" class="btn">View Faculty Attendance Roster ?</a>
    </div>
  </main>
  <script>
    setInterval(async () => {
      try {
        const res = await fetch('/api/telemetry');
        const data = await res.json();
        document.getElementById('attn-val').innerText = data.class_attention_index + '%';
        document.getElementById('phones-val').innerText = data.phones_detected;
      } catch (e) {}
    }, 1500);
  </script>
</body>
</html>
