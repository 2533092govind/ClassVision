<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClassVision - Faculty Academic Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const user = JSON.parse(sessionStorage.getItem('classvision_user') || 'null');
    if (!user || user.role !== 'FACULTY') {
      window.location.href = '/login.html';
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 flex flex-col items-center">
  <div class="max-w-5xl w-full space-y-6">

    <!-- Teacher Banner -->
    <header class="flex justify-between items-center pb-4 border-b border-slate-800">
      <div>
        <div class="flex items-center gap-2">
          <span class="bg-indigo-600/30 text-indigo-400 border border-indigo-500/40 text-xs px-2.5 py-0.5 rounded-full font-mono uppercase">Faculty Portal</span>
          <h1 class="text-xl font-bold text-slate-100">ClassVision Academic Administration</h1>
        </div>
        <p class="text-xs text-slate-400 mt-1">Instructor Session & Internal Assessment Panel</p><a href="/camera.html" class="inline-block mt-2 text-xs bg-sky-600 hover:bg-sky-500 text-white px-3 py-1 rounded-lg font-medium transition">&plus; Launch Live Attendance Camera</a>
      </div>
      <div class="flex items-center gap-4">
        <div class="text-right">
          <span class="text-xs text-slate-400">Department of Computer Applications</span>
          <div class="text-xs font-semibold text-sky-400">Semester III &bull; 2026</div>
        </div>
        <button onclick="logout()" class="text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-xl transition">Sign Out</button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="flex gap-3 border-b border-slate-800 pb-2">
      <button onclick="switchTab('attendanceTab')" id="btnAtt" class="px-4 py-1.5 rounded-lg text-xs font-medium bg-sky-600 text-white">Attendance Roster</button>
      <button onclick="switchTab('marksTab')" id="btnMarks" class="px-4 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 hover:text-white">Internal Assessment</button>
    </div>

    <!-- Attendance Module -->
    <div id="attendanceTab" class="space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Subject</label>
          <select id="subjectSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200">
            <option value="BCA3001T">BCA3001T (Python Programming)</option>
            <option value="BCA3002T">BCA3002T (Operating Systems)</option>
            <option value="BCA3003T">BCA3003T (Emerging Technologies)</option>
            <option value="BCA3004T">BCA3004T (Internet and Web Technology)</option>
            <option value="BCA3005T">BCA3005T (Software Engineering)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Lecture Date</label>
          <input type="date" id="dateInput" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Time Slot</label>
          <select id="slotSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200">
            <option value="09:00 AM">09:00 AM - 10:00 AM</option>
            <option value="10:00 AM">10:00 AM - 11:00 AM</option>
            <option value="11:30 AM">11:30 AM - 12:30 PM</option>
            <option value="01:30 PM">01:30 PM - 02:30 PM</option>
          </select>
        </div>
        <div class="flex items-end">
          <button onclick="loadSession()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium py-2 rounded-xl text-sm transition">Fetch Session</button>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
          <div>
            <h2 class="text-sm font-semibold text-slate-200">Lecture Roster</h2>
            <span id="sessionMeta" class="text-xs text-slate-400">Select session parameters</span>
          </div>
          <button id="exportBtn" onclick="exportToCSV()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition">Export Sheet</button>
        </div>
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="text-xs uppercase bg-slate-950/60 text-slate-400">
            <tr>
              <th class="px-4 py-2">Roll Number</th>
              <th class="px-4 py-2">Full Name</th>
              <th class="px-4 py-2 text-right">Live Verification</th>
            </tr>
          </thead>
          <tbody id="rosterBody" class="divide-y divide-slate-800/60">
            <tr><td colspan="3" class="px-4 py-4 text-center text-xs text-slate-500">No session loaded yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Marks Entry Module -->
    <div id="marksTab" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 grid grid-cols-1 md:grid-cols-5 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Student Roll No</label>
          <input type="text" id="mRoll" value="25261102114" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 font-mono" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Subject</label>
          <select id="mSubject" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200">
            <option value="BCA3001T">BCA3001T (Python Programming)</option>
            <option value="BCA3002T">BCA3002T (Operating Systems)</option>
            <option value="BCA3003T">BCA3003T (Emerging Technologies)</option>
            <option value="BCA3004T">BCA3004T (Internet and Web Technology)</option>
            <option value="BCA3005T">BCA3005T (Software Engineering)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Assessment Type</label>
          <select id="mType" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200">
            <option value="Sessional 1">Sessional 1</option>
            <option value="Sessional 2">Sessional 2</option>
            <option value="Lab Evaluation">Lab Evaluation</option>
            <option value="Pre-University Test">Pre-University Test</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Marks (Obt / Max)</label>
          <div class="flex gap-2">
            <input type="number" id="mObt" placeholder="28" class="w-1/2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200" />
            <input type="number" id="mMax" value="30" class="w-1/2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-400" />
          </div>
        </div>
        <div class="flex items-end">
          <button onclick="saveMark()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-xl text-sm transition">Record Mark</button>
        </div>
      </div>
      <p id="markStatus" class="text-xs text-emerald-400"></p>
    </div>

  </div>

  <script>
    let currentSessionRecords = [];
    const now = new Date();
    document.getElementById('dateInput').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

    function logout() {
      sessionStorage.removeItem('classvision_user');
      window.location.href = '/login.html';
    }

    function switchTab(tabId) {
      document.getElementById('attendanceTab').classList.toggle('hidden', tabId !== 'attendanceTab');
      document.getElementById('marksTab').classList.toggle('hidden', tabId !== 'marksTab');
      document.getElementById('btnAtt').className = tabId === 'attendanceTab' ? 'px-4 py-1.5 rounded-lg text-xs font-medium bg-sky-600 text-white' : 'px-4 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 hover:text-white';
      document.getElementById('btnMarks').className = tabId === 'marksTab' ? 'px-4 py-1.5 rounded-lg text-xs font-medium bg-sky-600 text-white' : 'px-4 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 hover:text-white';
    }

    async function loadSession() {
      const subject = document.getElementById('subjectSelect').value;
      const date = document.getElementById('dateInput').value;
      const slot = document.getElementById('slotSelect').value;
      document.getElementById('sessionMeta').textContent = `${subject} | ${date} | ${slot}`;

      const res = await fetch(`/api/attendance/session?subject_code=${subject}&date=${date}&slot=${encodeURIComponent(slot)}`);
      currentSessionRecords = await res.json();
      const tbody = document.getElementById('rosterBody');
      const exportBtn = document.getElementById('exportBtn');
      tbody.innerHTML = '';

      if (!currentSessionRecords.length) {
        tbody.innerHTML = `<tr><td colspan="3" class="px-4 py-4 text-center text-xs text-slate-500">No records found.</td></tr>`;
        exportBtn.classList.add('hidden');
        return;
      }

      exportBtn.classList.remove('hidden');
      currentSessionRecords.forEach(row => {
        const isPresent = row.status === 'PRESENT';
        tbody.innerHTML += `
          <tr class="hover:bg-slate-800/40">
            <td class="px-4 py-3 font-mono text-xs">${row.roll_number}</td>
            <td class="px-4 py-3 font-medium text-slate-100">${row.name}</td>
            <td class="px-4 py-3 text-right">
              <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${isPresent ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}">
                ${row.status}
              </span>
            </td>
          </tr>
        `;
      });
    }

    async function saveMark() {
      const payload = {
        roll_number: document.getElementById('mRoll').value,
        subject_code: document.getElementById('mSubject').value,
        exam_type: document.getElementById('mType').value,
        obtained_marks: parseFloat(document.getElementById('mObt').value),
        max_marks: parseFloat(document.getElementById('mMax').value)
      };
      await fetch('/api/marks/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      document.getElementById('markStatus').textContent = `Success: Saved ${payload.obtained_marks}/${payload.max_marks} for ${payload.roll_number}`;
      setTimeout(() => document.getElementById('markStatus').textContent = '', 3000);
    }

    function exportToCSV() {
      if (!currentSessionRecords.length) return;
      let csv = "Roll Number,Name,Status\n";
      currentSessionRecords.forEach(r => csv += `"${r.roll_number}","${r.name}","${r.status}"\n`);
      const link = document.createElement("a");
      link.href = encodeURI("data:text/csv;charset=utf-8," + csv);
      link.download = `Session_Attendance.csv`;
      link.click();
    }
  </script>
</body>
</html>
