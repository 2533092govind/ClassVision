<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClassVision - Portal Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-1">
      <div class="inline-block px-3 py-1 bg-sky-500/10 border border-sky-500/20 text-sky-400 text-xs font-mono font-semibold rounded-full uppercase mb-2">Academic ERP Gateway</div>
      <h1 class="text-2xl font-black tracking-tight text-white">ClassVision ERP</h1>
      <p class="text-xs text-slate-400">Pranveer Singh Institute of Technology</p>
    </div>

    <!-- Role Tabs -->
    <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1.5 rounded-2xl border border-slate-800 text-xs font-medium">
      <button type="button" id="tabStudent" onclick="setRole('STUDENT')" class="py-2.5 rounded-xl bg-sky-600 text-white font-semibold shadow">Student Login</button>
      <button type="button" id="tabFaculty" onclick="setRole('FACULTY')" class="py-2.5 rounded-xl text-slate-400 hover:text-white">Faculty Login</button>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label id="userLabel" class="block text-xs font-medium text-slate-300 mb-1.5">College Roll Number</label>
        <input type="text" id="username" required placeholder="e.g. 25261102114" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-sky-500 font-mono" />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Security Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-sky-500" />
      </div>

      <div id="errorBox" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl"></div>

      <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg shadow-sky-600/20">Sign In to Dashboard</button>
    </form>

    <div class="border-t border-slate-800/80 pt-4 text-center">
      <p class="text-[11px] text-slate-500">Student Default: Roll No / pass123 &bull; Faculty: faculty / faculty123</p>
    </div>
  </div>

  <script>
    let currentRole = 'STUDENT';

    function setRole(role) {
      currentRole = role;
      const stBtn = document.getElementById('tabStudent');
      const fcBtn = document.getElementById('tabFaculty');
      const uLabel = document.getElementById('userLabel');
      const uInput = document.getElementById('username');

      if (role === 'STUDENT') {
        stBtn.className = 'py-2.5 rounded-xl bg-sky-600 text-white font-semibold shadow';
        fcBtn.className = 'py-2.5 rounded-xl text-slate-400 hover:text-white';
        uLabel.textContent = 'College Roll Number';
        uInput.placeholder = 'e.g. 25261102114';
        uInput.value = '25261102114';
      } else {
        fcBtn.className = 'py-2.5 rounded-xl bg-indigo-600 text-white font-semibold shadow';
        stBtn.className = 'py-2.5 rounded-xl text-slate-400 hover:text-white';
        uLabel.textContent = 'Faculty Username';
        uInput.placeholder = 'e.g. faculty';
        uInput.value = 'faculty';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errorBox = document.getElementById('errorBox');
      errorBox.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, role: currentRole })
        });

        const data = await res.json();
        if (!res.ok) {
          errorBox.textContent = data.error || 'Authentication failed';
          errorBox.classList.remove('hidden');
          return;
        }

        // Save session credentials
        sessionStorage.setItem('classvision_user', JSON.stringify(data.user));

        if (data.user.role === 'FACULTY') {
          window.location.href = '/faculty.html';
        } else {
          window.location.href = '/index.html';
        }
      } catch (err) {
        errorBox.textContent = 'Unable to connect to server';
        errorBox.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
